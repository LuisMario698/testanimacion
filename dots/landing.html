<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puntos en la landing</title>
<style>
  :root{--papel:#E9E4D9;--texto:#0B2236;--apoyo:#4A5A6A;--marea:#1B5FC9;--golfo:#20B2C4;--borde:#D6CEBD;--sup:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--papel:#E9E4D9;--texto:#0B2236;--apoyo:#4A5A6A}}
  :root[data-theme="dark"]{--papel:#E9E4D9;--texto:#0B2236;--apoyo:#4A5A6A}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--papel);color:var(--texto);font-family:system-ui,sans-serif}
  nav{position:relative;z-index:2;display:flex;align-items:center;gap:24px;max-width:1340px;margin:0 auto;padding:20px 16px;font-size:17px;font-weight:600}
  nav b{font-size:24px;font-weight:800;margin-right:auto;color:var(--marea)}
  nav span{color:var(--apoyo)}
  @media (max-width:700px){nav span{display:none}}
  .hero{position:relative;overflow:clip;min-height:calc(100vh - 150px)}
  #cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .grid{position:relative;max-width:1340px;margin:0 auto;padding:48px 16px 64px;display:grid;gap:48px;align-items:center;grid-template-columns:1fr}
  @media (min-width:1000px){.grid{grid-template-columns:1fr 1fr;padding:80px 48px}}
  .lugar{margin:0;font-size:19px;font-weight:700;color:var(--marea)}
  h1{margin:14px 0 0;font-size:clamp(72px,10vw,104px);font-weight:800;letter-spacing:-.02em;line-height:1;transition:opacity 1s}
  .sub{max-width:34ch;font-size:21px;line-height:1.5;color:var(--apoyo)}
  .sub strong{color:var(--texto)}
  .acciones{display:flex;flex-wrap:wrap;gap:12px}
  .btn{min-height:56px;padding:0 24px;border-radius:18px;font:700 18px system-ui,sans-serif;display:inline-flex;align-items:center;border:0}
  .btn.p{background:var(--marea);color:#fff}
  .btn.s{background:var(--sup);color:var(--texto);border:1px solid var(--borde)}
  .foto{aspect-ratio:4/3;border-radius:28px;background:linear-gradient(160deg,#8CC3D1,#1B5FC9 70%,#0B2236);
        display:flex;align-items:end;padding:20px;color:#fff;font-size:17px;font-weight:600;box-shadow:0 10px 28px -16px rgba(11,34,54,.3)}
  .opciones{position:sticky;bottom:0;z-index:3;background:var(--sup);border-top:1px solid var(--borde);padding:12px 16px}
  .opciones div{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .opciones button{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--borde);background:var(--papel);color:var(--texto);font:600 16px system-ui,sans-serif;cursor:pointer}
  .opciones button[aria-pressed="true"]{background:var(--marea);color:#fff;border-color:var(--marea)}
  #desc{flex-basis:100%;margin:4px 0 0;font-size:16px;color:var(--apoyo)}
</style>
</head>
<body>
<nav><b>SiMAR</b><span>Proyecto</span><span>Impacto</span><span>Mapa</span></nav>
<header class="hero">
  <canvas id="cv"></canvas>
  <div class="grid">
    <div>
      <p class="lugar">Puerto Peñasco · Sonora · México</p>
      <h1 id="titulo">SiMAR</h1>
      <p class="sub">Transformando la gestión de residuos marinos con <strong>trazabilidad digital</strong> y compromiso con el <strong>Mar de Cortés</strong>.</p>
      <div class="acciones"><span class="btn p">Iniciar sesión</span><span class="btn s">Conocer el proyecto</span></div>
    </div>
    <div class="foto">Carrusel de fotos del proyecto</div>
  </div>
</header>
<section class="opciones"><div id="ops"><p id="desc"></p></div></section>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), hero = cv.parentElement, h1 = document.getElementById('titulo');
const MAREA = '#1B5FC9', GOLFO = '#20B2C4', PAPEL = '#E9E4D9';
let W, H, mouse = { x: -1e4, y: -1e4 }, scene, S;
const dot = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill(); };
const rnd = (a, b) => a + Math.random() * (b - a);

const SCENES = {
  corriente: {
    name: 'Corriente',
    desc: 'Corrientes marinas: puntos que fluyen por todo el hero dejando estela, como las líneas de marea. El cursor las desvía.',
    init: () => Array.from({ length: Math.round(W * H / 1600) }, () => ({ x: rnd(0, W), y: rnd(0, H), life: rnd(0, 300) })),
    draw(P, t) {
      ctx.fillStyle = 'rgba(233,228,217,.10)'; ctx.fillRect(0, 0, W, H); // borra poco a poco: deja estela
      ctx.fillStyle = MAREA;
      for (const p of P) {
        let a = Math.sin(p.x * 0.0035 + t * 0.00015) * 0.7 + Math.cos(p.y * 0.006 - t * 0.0001) * 0.5;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 150) a += (1 - d / 150) * 2.2; // remolino alrededor del cursor
        p.x += Math.cos(a) * 1.1; p.y += Math.sin(a) * 1.1;
        if (--p.life < 0 || p.x > W + 5 || p.x < -5 || p.y < -5 || p.y > H + 5) Object.assign(p, { x: rnd(-5, W * 0.3), y: rnd(0, H), life: rnd(200, 500) });
        ctx.globalAlpha = 0.55; dot(p.x, p.y, 1.3);
      }
      ctx.globalAlpha = 1;
    },
    trails: true,
  },

  cardumen: {
    name: 'Cardumen',
    desc: 'Un cardumen de peces-punto nada por el hero; se reagrupa solo y huye del cursor.',
    init: () => Array.from({ length: W < 700 ? 90 : 170 }, () => ({ x: rnd(W * 0.4, W), y: rnd(0, H), vx: rnd(-1, 1), vy: rnd(-1, 1) })),
    draw(P) {
      for (const p of P) {
        let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
        for (const q of P) {
          const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
          if (q === p || d2 > 3600) continue;
          n++; ax += q.vx; ay += q.vy; cx += dx; cy += dy;
          if (d2 < 220) { sx -= dx; sy -= dy; }
        }
        if (n) { p.vx += (ax / n - p.vx) * 0.05 + cx / n * 0.004; p.vy += (ay / n - p.vy) * 0.05 + cy / n * 0.004; }
        p.vx += sx * 0.03; p.vy += sy * 0.03;
        const mx = p.x - mouse.x, my = p.y - mouse.y, md = Math.hypot(mx, my);
        if (md < 140) { p.vx += mx / md * 0.6; p.vy += my / md * 0.6; }
        const m = 60; // bordes suaves
        if (p.x < m) p.vx += 0.15; if (p.x > W - m) p.vx -= 0.15;
        if (p.y < m) p.vy += 0.15; if (p.y > H - m) p.vy -= 0.15;
        const sp = Math.hypot(p.vx, p.vy), lim = Math.min(3.2, Math.max(1.4, sp)) / (sp || 1);
        p.vx *= lim; p.vy *= lim; p.x += p.vx; p.y += p.vy;
      }
      ctx.lineCap = 'round'; ctx.lineWidth = 3.5;
      for (const [i, p] of P.entries()) {
        const sp = Math.hypot(p.vx, p.vy);
        ctx.strokeStyle = i % 3 ? MAREA : GOLFO; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx / sp * 8, p.y - p.vy / sp * 8); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    },
  },

  titulo: {
    name: 'Título de puntos',
    desc: 'El título SiMAR se arma con puntos que llegan nadando; luego aparece el texto real y queda una ola de puntos viva debajo, que se dispersa con el cursor.',
    init() {
      h1.style.opacity = 0;
      const r = h1.getBoundingClientRect(), hr = hero.getBoundingClientRect(), cs = getComputedStyle(h1);
      const o = document.createElement('canvas').getContext('2d');
      o.canvas.width = W; o.canvas.height = H;
      o.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; o.letterSpacing = cs.letterSpacing;
      o.textBaseline = 'middle';
      const x0 = r.left - hr.left, yc = r.top - hr.top + r.height / 2, tw = o.measureText('SiMAR').width, size = parseFloat(cs.fontSize);
      o.fillText('SiMAR', x0, yc);
      const d = o.getImageData(0, 0, W, H).data, P = [], g = 4;
      for (let y = 0; y < H; y += g) for (let x = 0; x < W; x += g)
        if (d[(y * W + x) * 4 + 3] > 128) P.push({ hx: x, hy: y, x: rnd(-200, -20), y: y + rnd(-200, 200), vx: rnd(4, 10), vy: 0, wave: false });
      for (let x = 0; x < tw * 0.92; x += 4) // ola del logo, hecha de puntos
        P.push({ hx: x0 + 4 + x, hy: yc + size * 0.62, x: rnd(-200, -20), y: yc + rnd(-200, 200), vx: rnd(4, 10), vy: 0, wave: true, k: x });
      P.t0 = performance.now();
      return P;
    },
    draw(P, t) {
      const e = Math.min(1, Math.max(0, (t - P.t0 - 2600) / 900)); // después de armarse: aparece el texto real
      h1.style.opacity = e;
      for (const p of P) {
        const ty = p.hy + (p.wave ? Math.sin(p.k * 0.05 - t * 0.003) * 5 : 0);
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (p.wave && d2 < 9000) { const f = (1 - d2 / 9000) * 2 / Math.sqrt(d2 + 1); p.vx += dx * f; p.vy += dy * f; }
        p.vx = (p.vx + (p.hx - p.x) * 0.02) * 0.88; p.vy = (p.vy + (ty - p.y) * 0.02) * 0.88;
        p.x += p.vx; p.y += p.vy;
        const a = p.wave ? 1 : 1 - e;
        if (!a) continue;
        ctx.globalAlpha = a; ctx.fillStyle = p.wave ? GOLFO : MAREA;
        dot(p.x, p.y, p.wave ? 2.4 : 1.6);
      }
      ctx.globalAlpha = 1;
    },
  },

  ola: {
    name: 'Ola viva',
    desc: 'Un mar de puntos en perspectiva ondula en la parte baja del hero y lleva la vista hacia la siguiente sección. El cursor levanta el agua.',
    init() {
      const P = [];
      for (let r = 0; r < 22; r++) for (let c = 0; c < 70; c++) P.push({ x: c / 69 * 3 - 1.5, v: 1 - r / 21 });
      return P;
    },
    draw(P, t) {
      t *= 0.001;
      const top = H * 0.62;
      for (const p of P) {
        const z = 1 + p.v * 3, f = (1 / z - 0.25) / 0.75, sx = W / 2 + p.x / z * W * 0.6, sy = top + (H - top) * f;
        const lift = Math.exp(-((sx - mouse.x) ** 2 + (sy - mouse.y) ** 2) / 6000);
        const w = Math.sin(p.x * 3 + t * 0.8) * 0.5 + Math.sin(p.v * 9 - t * 1.1) * 0.5;
        ctx.globalAlpha = (1 - p.v * 0.75) * 0.8;
        ctx.fillStyle = p.v < 0.3 ? MAREA : GOLFO;
        dot(sx, sy - (w + lift * 1.6) * 16 / z, 2.6 / z);
      }
      ctx.globalAlpha = 1;
    },
  },
};

function start(name) {
  scene = SCENES[name];
  h1.style.opacity = 1;
  ctx.clearRect(0, 0, W, H);
  S = scene.init();
  document.getElementById('desc').textContent = scene.desc;
  for (const b of document.querySelectorAll('#ops button')) b.setAttribute('aria-pressed', b.dataset.k === name);
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = hero.clientWidth; H = hero.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene) start(Object.keys(SCENES).find(k => SCENES[k] === scene));
}
function frame(t) {
  if (!scene.trails) ctx.clearRect(0, 0, W, H);
  scene.draw(S, t);
  requestAnimationFrame(frame);
}

const ops = document.getElementById('ops');
for (const k in SCENES) {
  const b = document.createElement('button');
  b.textContent = SCENES[k].name; b.dataset.k = k; b.onclick = () => start(k);
  ops.insertBefore(b, document.getElementById('desc'));
}
addEventListener('pointermove', e => { const r = hero.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
document.documentElement.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
addEventListener('resize', resize);
resize();
start('corriente');
requestAnimationFrame(frame);
</script>
</body>
</html>
